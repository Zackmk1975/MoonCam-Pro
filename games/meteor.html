<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Meteor Dash — MoonCam</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071022;color:#f2f7ff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;user-select:none}
body{display:flex;flex-direction:column;overscroll-behavior:none}.hudTop{flex:none;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 11px 8px;background:linear-gradient(90deg,#111b38,#10182e);min-height:56px}.hudTop strong{font-size:14px;letter-spacing:.4px;display:block}.hudTop small{font-size:9px;color:#b3bfdc;display:block;margin-top:2px}.stats{text-align:right;display:flex;gap:9px;align-items:center}.scoreWrap{font-variant-numeric:tabular-nums}.scoreWrap b{display:block;color:#89efed;font-size:18px;line-height:1.1}.scoreWrap small{font-size:8px;letter-spacing:1px}.lives{letter-spacing:1px;color:#ff8da4;font-size:13px;min-width:40px}.playArea{position:relative;flex:1;min-height:0;margin:0 6px 5px;border:1px solid #3e5071;border-radius:16px;overflow:hidden;background:#0b1634;touch-action:none;isolation:isolate}.playArea canvas{width:100%;height:100%;display:block;touch-action:none}.playArea::after{position:absolute;content:"";inset:0;pointer-events:none;background:linear-gradient(180deg,#0a112236,transparent 15%,transparent 75%,#0c123755);z-index:1}.gameBadge{position:absolute;z-index:3;top:9px;left:9px;background:#08172fa8;border:1px solid #b0c8e233;border-radius:100px;padding:5px 9px;font-size:9px;color:#d0ecff;pointer-events:none}.boost{position:absolute;z-index:3;right:9px;top:9px;color:#d7c5ff;font-size:9px;font-weight:800;background:#27254c9c;border:1px solid #a19cff55;border-radius:100px;padding:5px 8px;pointer-events:none}.overlay{position:absolute;inset:0;z-index:7;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:18px;background:rgba(6,12,32,.76);backdrop-filter:blur(7px)}.overlay[hidden]{display:none!important}.logo{font-size:44px;filter:drop-shadow(0 0 17px #7f9dff99)}h1{font-size:clamp(19px,6vw,25px);margin:7px 0 7px;letter-spacing:-.6px}p{font-size:12px;line-height:1.55;color:#c0d1ed;max-width:275px;margin:0 0 13px}.overlay button{border:0;border-radius:13px;background:linear-gradient(110deg,#bcb1ff,#8ceae9);color:#182038;font-size:13px;font-weight:900;padding:11px 23px;min-height:45px}.bottom{min-height:38px;padding:0 10px 5px;display:flex;align-items:center;justify-content:space-between;gap:7px;flex:none}.bottom button{border-radius:11px;border:1px solid #54668a;background:#263453;color:#eef6ff;font-weight:800;font-size:11px;min-height:32px;padding:6px 11px}.bottom span{font-size:9px;color:#9caecf;line-height:1.3;text-align:right}.bottom em{color:#8fe3e2;font-style:normal}@media(max-height:350px){.hudTop{min-height:43px;padding:5px 9px}.bottom{min-height:31px}.bottom button{min-height:26px}.overlay p{margin-bottom:8px}}@media(prefers-reduced-motion:reduce){.overlay{backdrop-filter:none}}
</style></head><body>
<header class="hudTop"><div><strong>🚀 METEOR DASH</strong><small id="difficulty">Vùng 1 · Tân binh</small></div><div class="stats"><div class="scoreWrap"><small>ĐIỂM</small><b id="score">0000</b></div><div><span class="lives" id="lives">♥♥♥</span><small id="record">KỶ LỤC 0</small></div></div></header>
<div class="playArea" id="field"><canvas id="canvas" aria-label="Tàu vũ trụ tránh thiên thạch"></canvas><div class="gameBadge" id="hint">↔ Kéo để lái tàu</div><div class="boost" id="buff">✧ Nhặt tinh thể để ghi điểm</div>
<div class="overlay" id="overlay"><span class="logo">🛸</span><h1 id="overlayTitle">Hành trình thiên thạch</h1><p id="overlayDesc">Kéo ngón tay để lái tàu. Né đá đỏ, lấy tinh thể xanh, nhặt khiên tím để bảo vệ tàu!</p><button id="playBtn">Bắt đầu bay</button></div></div>
<footer class="bottom"><button id="pauseBtn" type="button">Ⅱ Tạm dừng</button><span>Đồ họa chỉ hiển thị trong game<br><em>Không chèn vào video camera</em></span></footer>
<script>
'use strict';
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{alpha:false}),field=document.getElementById('field'),overlay=document.getElementById('overlay'),playBtn=document.getElementById('playBtn'),pauseBtn=document.getElementById('pauseBtn'),buff=document.getElementById('buff');
let W=300,H=430,dpr=1,last=0,accum=0,raf=0,active=false,manualPaused=false,parentPaused=false,life=3,score=0,best=0,elapsed=0,spawnTime=0,invincible=0,shield=0,flash=0,combo=0;let rocks=[],stars=[],particles=[];const ship={x:150,y:370,target:150,radius:13};
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(v,b));
function setOverlay(title,description,button){document.getElementById('overlayTitle').textContent=title;document.getElementById('overlayDesc').textContent=description;playBtn.textContent=button;overlay.hidden=false}
function resize(){const r=field.getBoundingClientRect(),prevW=W;W=Math.max(100,r.width-2);H=Math.max(100,r.height-2);dpr=Math.min(window.devicePixelRatio||1,1.75);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ship.y=H-45;ship.x=clamp(ship.x*(W/prevW),19,W-19);ship.target=ship.x;stars=Array.from({length:36},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(.45,1.4),v:rnd(9,25)}));draw()}
window.addEventListener('resize',resize);if('ResizeObserver'in window)new ResizeObserver(resize).observe(field);
function hud(){document.getElementById('score').textContent=String(Math.floor(score)).padStart(4,'0');document.getElementById('lives').textContent='♥'.repeat(life)+'♡'.repeat(3-life);document.getElementById('record').textContent='KỶ LỤC '+Math.floor(Math.max(score,best));const wave=Math.min(8,1+Math.floor(elapsed/18));document.getElementById('difficulty').textContent='Vùng '+wave+(wave<=2?' · Tân binh':wave<=4?' · Thám hiểm':' · Thử thách');buff.textContent=shield?'⬡ Khiên bảo vệ: '+shield+' lần':combo>=2?'✦ Combo '+combo+' · Tinh thể':'✧ Nhặt tinh thể để ghi điểm'}
function emit(x,y,color,count){for(let i=0;i<count;i++)particles.push({x,y,vx:rnd(-75,75),vy:rnd(-90,65),life:rnd(.18,.50),max:.5,color})}
function start(){active=true;manualPaused=false;parentPaused=false;life=3;score=0;elapsed=0;spawnTime=.6;invincible=0;shield=0;flash=0;combo=0;rocks=[];particles=[];ship.x=ship.target=W/2;overlay.hidden=true;pauseBtn.textContent='Ⅱ Tạm dừng';hud();last=0;accum=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function end(){active=false;cancelAnimationFrame(raf);best=Math.max(best,score);hud();parent.postMessage({type:'moonplay-score',game:'meteor',score:Math.floor(best)},'*');setOverlay('Chuyến bay kết thúc','Bạn đạt '+Math.floor(score)+' điểm. Hãy thử lấy thêm tinh thể và giữ khiên để lập kỷ lục!','Bay lại')}
function pause(){if(!active||manualPaused)return;manualPaused=true;cancelAnimationFrame(raf);pauseBtn.textContent='▶ Tiếp tục';setOverlay('Đang tạm dừng','Trò chơi được tạm dừng; camera và video vẫn hoạt động độc lập.','Tiếp tục')}
function resume(){if(!active)return;manualPaused=false;overlay.hidden=true;pauseBtn.textContent='Ⅱ Tạm dừng';if(parentPaused)return;last=0;accum=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
playBtn.addEventListener('click',()=>{if(active&&manualPaused)resume();else start()});pauseBtn.addEventListener('click',()=>{if(active){if(manualPaused)resume();else pause()}else start()});
function pointer(e){const r=canvas.getBoundingClientRect();ship.target=clamp(e.clientX-r.left-1,19,W-19);if(e.type==='pointerdown'){try{canvas.setPointerCapture(e.pointerId)}catch{}}}
canvas.addEventListener('pointerdown',pointer);canvas.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||e.buttons)pointer(e)});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();ship.target=clamp(ship.target+(e.key==='ArrowLeft'?-36:36),19,W-19)}if(e.code==='Space'){e.preventDefault();pauseBtn.click()}});
function spawn(){let type='rock';const dice=Math.random();if(dice<.16)type='gem';else if(dice<.195)type='shield';const r=type==='rock'?rnd(11,23):type==='gem'?10:12;let x=rnd(r+10,W-r-10);for(let t=0;t<6;t++){if(!rocks.some(o=>o.y<60&&Math.abs(o.x-x)<o.r+r+15))break;x=rnd(r+10,W-r-10)}const speed=(type==='rock'?90:80)+Math.min(135,elapsed*2.0)+rnd(8,40);rocks.push({x,y:-r-9,r,type,speed,angle:rnd(0,6.28),spin:rnd(-1.3,1.3),shape:Array.from({length:9},()=>rnd(.76,1.07))})}
function tick(dt){elapsed+=dt;score+=dt*5;invincible=Math.max(0,invincible-dt);flash=Math.max(0,flash-dt);ship.x+=(ship.target-ship.x)*Math.min(1,dt*18);const gap=Math.max(.43,.86-elapsed*.004);spawnTime-=dt;if(spawnTime<=0){spawn();spawnTime+=gap*rnd(.85,1.17)}for(const s of stars){s.y+=s.v*dt;if(s.y>H){s.y=0;s.x=rnd(0,W)}}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(x=>x.life>0);if(particles.length>85)particles.splice(0,particles.length-85);
 for(let i=rocks.length-1;i>=0;i--){const o=rocks[i];o.y+=o.speed*dt;o.angle+=o.spin*dt;if(o.y-o.r>H){rocks.splice(i,1);continue}const dx=o.x-ship.x,dy=o.y-ship.y;const hit=(o.r+ship.radius*.74)**2;if(dx*dx+dy*dy<hit){rocks.splice(i,1);if(o.type==='gem'){combo=Math.min(9,combo+1);score+=30+combo*8;emit(o.x,o.y,'#6ef9db',7)}else if(o.type==='shield'){shield=Math.min(2,shield+1);score+=15;emit(o.x,o.y,'#bfa7ff',9)}else if(invincible<=0){if(shield){shield--;invincible=.55;emit(ship.x,ship.y,'#c1adff',15)}else{life--;combo=0;flash=.2;invincible=1.15;emit(ship.x,ship.y,'#ff808b',16);if(life<=0){hud();end();return}}}}}hud()}
function background(){ctx.fillStyle='#081127';ctx.fillRect(0,0,W,H);let gr=ctx.createLinearGradient(0,0,W,H);gr.addColorStop(0,'#0e1c3d');gr.addColorStop(.5,'#112248');gr.addColorStop(1,'#070e22');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);ctx.fillStyle='#b8dbff';for(const s of stars){ctx.globalAlpha=.34+(s.r/2)*.3;ctx.fillRect(s.x,s.y,s.r,s.r*2)}ctx.globalAlpha=1;ctx.strokeStyle='#6685bb16';ctx.lineWidth=1;for(let i=1;i<5;i++){const x=W*i/5;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}}
function draw(){background();for(const o of rocks){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.angle);if(o.type==='gem'){ctx.shadowBlur=8;ctx.shadowColor='#64ffe2';ctx.fillStyle='#65e9d8';ctx.strokeStyle='#c4fff8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-o.r);ctx.lineTo(o.r*.82,0);ctx.lineTo(0,o.r);ctx.lineTo(-o.r*.82,0);ctx.closePath();ctx.fill();ctx.stroke()}else if(o.type==='shield'){ctx.shadowBlur=8;ctx.shadowColor='#a48bff';ctx.strokeStyle='#d5c8ff';ctx.lineWidth=3;ctx.fillStyle='#7f68dd';ctx.beginPath();for(let i=0;i<6;i++){const a=Math.PI*2*i/6-Math.PI/2;const x=Math.cos(a)*o.r,y=Math.sin(a)*o.r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle='#f7ebff';ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.stroke()}else{ctx.fillStyle='#946d80';ctx.strokeStyle='#ffc7b6';ctx.lineWidth=1.5;ctx.beginPath();for(let i=0;i<9;i++){const a=i*Math.PI*2/9,r=o.r*o.shape[i];i?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#61465c';ctx.beginPath();ctx.arc(-o.r*.25,-o.r*.1,o.r*.26,0,7);ctx.fill()}ctx.restore()}
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,2.6,2.6)}ctx.globalAlpha=1;
 if(active){ctx.save();ctx.translate(ship.x,ship.y);if(invincible>0&&Math.floor(invincible*12)%2===0)ctx.globalAlpha=.42;if(shield){ctx.strokeStyle='#c7b2ff';ctx.lineWidth=2.3;ctx.shadowBlur=12;ctx.shadowColor='#a5b3ff';ctx.beginPath();ctx.arc(0,0,24,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0}ctx.fillStyle='#fbaf73';ctx.beginPath();ctx.moveTo(-6,12);ctx.lineTo(0,22+rnd(0,5));ctx.lineTo(6,12);ctx.fill();ctx.shadowColor='#77e4ff';ctx.shadowBlur=10;ctx.fillStyle='#b3e9ff';ctx.strokeStyle='#f1fcff';ctx.lineWidth=1.7;ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(15,13);ctx.lineTo(5,8);ctx.lineTo(0,13);ctx.lineTo(-5,8);ctx.lineTo(-15,13);ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#8179e8';ctx.beginPath();ctx.ellipse(0,-3,4.5,8,0,0,Math.PI*2);ctx.fill();ctx.restore()}
 if(flash>0){ctx.fillStyle='rgba(255,95,108,.11)';ctx.fillRect(0,0,W,H)}}
function loop(t){if(!active||manualPaused||parentPaused)return;if(!last)last=t;accum+=Math.min(.06,(t-last)/1000);last=t;if(accum>=1/30){const dt=Math.min(accum,.06);accum=0;tick(dt);draw()}if(active)raf=requestAnimationFrame(loop)}
window.addEventListener('message',e=>{if(e.data?.type==='moonplay-pause'){parentPaused=true;cancelAnimationFrame(raf)}else if(e.data?.type==='moonplay-resume'){parentPaused=false;if(active&&!manualPaused){last=0;accum=0;raf=requestAnimationFrame(loop)}}else if(e.data?.type==='moonplay-best-value'&&e.data.game==='meteor'){const n=Number(e.data.best);if(Number.isFinite(n)&&n>=0){best=Math.max(best,n);hud()}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){parentPaused=true;cancelAnimationFrame(raf)}else if(parentPaused){parentPaused=false;if(active&&!manualPaused){last=0;accum=0;raf=requestAnimationFrame(loop)}}});
resize();hud();draw();parent.postMessage({type:'moonplay-best-request',game:'meteor'},'*');
</script></body></html>
