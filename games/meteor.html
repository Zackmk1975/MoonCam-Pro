<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Meteor Dash</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;color:#f6f5ff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#070e25;user-select:none}body{display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;padding:13px 14px 7px;flex:none;z-index:1;background:linear-gradient(#070e25dd,#070e2500)}header strong{font-size:13px;letter-spacing:1px}header small{font-size:9px;color:#9ba9cc;display:block;margin-top:2px}#score{font-size:18px;color:#a8ffed;font-weight:900;letter-spacing:1px}.meter{font-size:12px;color:#ff9db0;letter-spacing:3px;text-align:right}.field{position:relative;flex:1;min-height:0;margin:0 8px 7px;border:1px solid #36496a;border-radius:17px;overflow:hidden;background:radial-gradient(ellipse at 50% 75%,#1b3463 0%,#08142b 60%,#070d20 100%);touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.field:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(#080d1a40,transparent 25%,transparent 65%,#0c16416b)}.hud{position:absolute;z-index:2;left:9px;bottom:12px;border-radius:100px;background:#0a1430a8;border:1px solid #ffffff22;font-size:9px;color:#a9c1e4;padding:6px 10px;pointer-events:none}.intro{position:absolute;z-index:5;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#080e23a8;backdrop-filter:blur(6px);text-align:center;padding:16px}.intro.hidden{display:none}.orb{font-size:42px;filter:drop-shadow(0 8px 18px #8679ff77);animation:float 3s ease-in-out infinite}.intro h1{font-size:23px;line-height:1.1;margin:11px 0 6px;letter-spacing:-1px}.intro p{font-size:11px;line-height:1.6;color:#b8c6e6;max-width:230px;margin:0 0 14px}.intro button{background:linear-gradient(110deg,#c2b3ff,#86edec);border:0;color:#18213c;font-size:13px;font-weight:900;min-height:43px;padding:0 23px;border-radius:13px}footer{flex:none;color:#8592b1;font-size:9px;padding:0 12px 10px;text-align:center}@keyframes float{50%{transform:translateY(-7px)}}
</style></head><body><header><div><strong>🚀 METEOR DASH</strong><small>Né thiên thạch · Nhặt năng lượng</small></div><div style="text-align:right"><div id="score">0000</div><div id="lives" class="meter">♥ ♥ ♥</div></div></header><div class="field" id="field"><canvas id="canvas"></canvas><div class="hud" id="hint">Kéo tàu bằng ngón tay</div><div class="intro" id="intro"><div class="orb">🛸</div><h1 id="introTitle">Bay qua ngân hà</h1><p id="introText">Chạm và kéo để điều khiển tàu. Tránh thiên thạch, thu thập tinh thể xanh.</p><button id="playBtn">Bắt đầu chơi</button></div></div><footer>Trò chơi chạy độc lập · Làm mới game không dừng quay</footer><script>
'use strict';const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d',{alpha:false}),field=document.querySelector('#field'),intro=document.querySelector('#intro'),playBtn=document.querySelector('#playBtn');let W=300,H=400,dpr=1,last=0,raf=0,paused=false,running=false,score=0,lives=3,elapsed=0,spawnTick=0,ship={x:150,y:300,target:150},objects=[],stars=[];
function resize(){const r=field.getBoundingClientRect();W=Math.max(1,r.width-2);H=Math.max(1,r.height-2);dpr=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ship.y=H-54;ship.x=Math.min(Math.max(ship.x,20),W-20);ship.target=ship.x;stars=Array.from({length:42},()=>({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*1.15,v:12+Math.random()*24}))}
window.addEventListener('resize',resize);resize();
function updateHUD(){document.querySelector('#score').textContent=String(Math.floor(score)).padStart(4,'0');document.querySelector('#lives').textContent='♥ '.repeat(lives).trim()+' ♡ '.repeat(3-lives)}
function reset(){running=true;paused=false;score=0;lives=3;elapsed=0;spawnTick=0;objects=[];ship.x=ship.target=W/2;intro.classList.add('hidden');updateHUD();last=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
playBtn.addEventListener('click',reset);
function end(){running=false;document.querySelector('#introTitle').textContent='Hành trình kết thúc';document.querySelector('#introText').textContent='Bạn đạt '+Math.floor(score)+' điểm. Thử né lâu hơn để lập kỷ lục!';playBtn.textContent='Chơi lại';intro.classList.remove('hidden');sendScore();}
function sendScore(){parent.postMessage({type:'moonplay-score',game:'meteor',score:Math.floor(score)},'*')}
function pointer(e){const rect=canvas.getBoundingClientRect();ship.target=Math.max(22,Math.min(W-22,e.clientX-rect.left));if(e.type==='pointerdown'){try{canvas.setPointerCapture(e.pointerId)}catch{}}}
canvas.addEventListener('pointerdown',pointer);canvas.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pointer(e)});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){ship.target=Math.max(22,ship.target-30);e.preventDefault()}if(e.key==='ArrowRight'){ship.target=Math.min(W-22,ship.target+30);e.preventDefault()}});
function spawn(){const gem=Math.random()<.27;const r=gem?10:13+Math.random()*13;objects.push({x:r+Math.random()*(W-2*r),y:-r-10,r,gem,vy:(gem?100:120)+Math.min(170,elapsed*4)+Math.random()*42,rot:Math.random()*6.28,spin:(Math.random()-.5)*2})}
function step(dt){elapsed+=dt;score+=dt*1.5;ship.x+=(ship.target-ship.x)*Math.min(1,dt*15);spawnTick+=dt;if(spawnTick>Math.max(.32,.8-elapsed*.012)){spawnTick=0;spawn()}for(const s of stars){s.y+=s.v*dt;if(s.y>H){s.y=0;s.x=Math.random()*W}}
 for(let i=objects.length-1;i>=0;i--){const o=objects[i];o.y+=o.vy*dt;o.rot+=o.spin*dt;if(o.y-o.r>H){objects.splice(i,1);continue}const dx=o.x-ship.x,dy=o.y-ship.y;if(dx*dx+dy*dy<(o.r+17)*(o.r+17)){objects.splice(i,1);if(o.gem){score+=25}else{lives--;if(lives<=0){updateHUD();end();return}}}}
 updateHUD()}
function draw(){ctx.fillStyle='#07112b';ctx.fillRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#122449');bg.addColorStop(.5,'#0c1635');bg.addColorStop(1,'#0a1734');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);for(const s of stars){ctx.fillStyle='rgba(215,240,255,.7)';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}
 ctx.strokeStyle='rgba(88,143,211,.12)';ctx.lineWidth=1;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(W*(i+1)/6,0);ctx.lineTo(W*(i+1)/6,H);ctx.stroke()}
 for(const o of objects){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);if(o.gem){ctx.shadowColor='#4cf6d7';ctx.shadowBlur=13;ctx.fillStyle='#82f7df';ctx.strokeStyle='#e4fff8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-o.r);ctx.lineTo(o.r*.85,0);ctx.lineTo(0,o.r);ctx.lineTo(-o.r*.85,0);ctx.closePath();ctx.fill();ctx.stroke()}else{ctx.fillStyle='#8e829f';ctx.strokeStyle='#cbb9d0';ctx.lineWidth=2;ctx.beginPath();for(let j=0;j<8;j++){const a=j*Math.PI/4,r=o.r*(j%2?.86:1);if(!j)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#594d75';ctx.beginPath();ctx.arc(-o.r*.24,-o.r*.12,o.r*.2,0,Math.PI*2);ctx.fill()}ctx.restore()}
 if(running){ctx.save();ctx.translate(ship.x,ship.y);ctx.shadowColor='#80f0ff';ctx.shadowBlur=20;ctx.fillStyle='#b5e5ff';ctx.strokeStyle='#f4f5ff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-23);ctx.lineTo(16,14);ctx.lineTo(7,10);ctx.lineTo(0,16);ctx.lineTo(-7,10);ctx.lineTo(-16,14);ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#8c7bff';ctx.fillRect(-4,7,8,8+Math.random()*10);ctx.restore()}}
function loop(t){if(!running||paused)return;if(!last)last=t;const dt=Math.min(.05,(t-last)/1000);if(dt<1/32){raf=requestAnimationFrame(loop);return}last=t;step(dt);draw();if(running)raf=requestAnimationFrame(loop)}
window.addEventListener('message',e=>{if(e.data?.type==='moonplay-pause'){paused=true;cancelAnimationFrame(raf)}if(e.data?.type==='moonplay-resume'){if(running&&paused){paused=false;last=0;raf=requestAnimationFrame(loop)}}});draw();
</script></body></html>
