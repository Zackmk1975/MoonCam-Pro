<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Star Hunter</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#f4f7ff;background:#070f25;user-select:none}body{display:flex;flex-direction:column}.header{flex:none;display:flex;justify-content:space-between;align-items:center;padding:12px 15px 8px}.header strong{font-size:14px}.header small{display:block;font-size:9px;color:#97a6c6;margin-top:4px}.points{text-align:right}.points strong{font-size:21px;color:#82fff0}.field{position:relative;flex:1;min-height:0;margin:0 8px 8px;border-radius:18px;border:1px solid #465578;overflow:hidden;background:radial-gradient(circle at 30% 20%,#273267 0,transparent 48%),radial-gradient(circle at 80% 75%,#143d56 0,transparent 50%),#090d25;touch-action:manipulation}.field:before{content:'';position:absolute;inset:0;background-image:radial-gradient(#ffffff77 .8px,transparent 1px);background-size:29px 31px;opacity:.34;pointer-events:none}.target{position:absolute;width:68px;height:68px;border:2px solid #f8fff9;border-radius:50%;display:none;place-items:center;box-shadow:0 0 13px #6cf0dc,0 0 44px #6cf0dc77,inset 0 0 20px #6cf0dc88;background:radial-gradient(circle,#fefefa,#9cf4e4 35%,#4db7d588 63%,transparent 70%);font-size:24px;color:#135274;transform:translate(-50%,-50%);touch-action:manipulation}.target.show{display:grid;animation:pulse .85s ease-in-out infinite alternate}.target:active{transform:translate(-50%,-50%) scale(.86)}.progress{position:absolute;top:13px;left:13px;right:13px;height:7px;border-radius:9px;overflow:hidden;background:#ffffff25}.progress span{display:block;height:100%;width:100%;background:linear-gradient(90deg,#b7a4ff,#75f8df)}.combo{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;font-size:30px;font-weight:950;text-shadow:0 5px 25px #00d6d6}.combo.pop{animation:pop .45s}.intro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:15px;background:#071122c2;backdrop-filter:blur(6px);text-align:center;z-index:2}.intro.hidden{display:none}.intro .emoji{font-size:52px}.intro h1{font-size:24px;margin:8px 0}.intro p{max-width:250px;font-size:11px;color:#bfcae8;line-height:1.6}.intro button{background:linear-gradient(110deg,#a9f0ea,#b8a8ff);border:none;color:#1c2247;min-height:46px;padding:0 22px;border-radius:13px;font-weight:900}.footer{flex:none;text-align:center;padding:0 12px 10px;font-size:9px;color:#8895ae}@keyframes pulse{to{box-shadow:0 0 19px #6cf0dc,0 0 65px #6cf0dccc,inset 0 0 24px #6cf0dcaa}}@keyframes pop{20%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-135%)}}@media(max-height:600px){.intro .emoji{font-size:35px}.intro h1{font-size:18px}}</style></head><body><header class="header"><div><strong>✨ STAR HUNTER</strong><small>Chạm đúng sao càng nhanh càng tốt</small></div><div class="points"><strong id="score">0</strong><small id="time">30 GIÂY</small></div></header><main class="field" id="field"><div class="progress"><span id="progress"></span></div><button id="target" class="target" aria-label="Chạm để bắt sao">✦</button><div id="combo" class="combo">+10</div><section class="intro" id="intro"><div class="emoji">🌌</div><h1 id="title">Thử phản xạ của bạn</h1><p id="desc">Bạn có 30 giây. Chạm những ngôi sao xuất hiện ngẫu nhiên để ghi điểm và tạo combo.</p><button id="go">Bắt đầu săn sao</button></section></main><footer class="footer">Chỉ xử lý hiệu ứng trò chơi · Video quay vẫn lấy từ camera</footer><script>
'use strict';const f=document.querySelector('#field'),target=document.querySelector('#target'),intro=document.querySelector('#intro'),go=document.querySelector('#go');let score=0,combo=0,left=30,timer=null,playing=false,paused=false;
function position(){const r=f.getBoundingClientRect(),x=42+Math.random()*Math.max(5,r.width-84),y=54+Math.random()*Math.max(5,r.height-104);target.style.left=x+'px';target.style.top=y+'px';target.style.transform='translate(-50%,-50%) scale('+(.75+Math.random()*.35)+')'}
function update(){document.querySelector('#score').textContent=score;document.querySelector('#time').textContent=left+' GIÂY';document.querySelector('#progress').style.width=left/30*100+'%'}
function start(){score=0;combo=0;left=30;playing=true;paused=false;intro.classList.add('hidden');target.classList.add('show');position();update();clearInterval(timer);timer=setInterval(()=>{if(!playing||paused)return;left--;update();if(left<=0)end()},1000)}
function end(){playing=false;clearInterval(timer);target.classList.remove('show');document.querySelector('#title').textContent='Hoàn thành!';document.querySelector('#desc').textContent='Bạn bắt được '+score+' điểm trong 30 giây. Muốn phá kỷ lục không?';go.textContent='Chơi lại';intro.classList.remove('hidden');parent.postMessage({type:'moonplay-score',game:'tap',score},'*')}
go.addEventListener('click',start);target.addEventListener('click',()=>{if(!playing||paused)return;combo++;const gained=10+Math.min(50,combo*2);score+=gained;const pop=document.querySelector('#combo');pop.textContent='+'+gained;pop.classList.remove('pop');void pop.offsetWidth;pop.classList.add('pop');position();update()});f.addEventListener('pointerdown',e=>{if(e.target!==target&&playing)combo=0});window.addEventListener('message',e=>{if(e.data?.type==='moonplay-pause')paused=true;else if(e.data?.type==='moonplay-resume')paused=false});update();
</script></body></html>
