<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Moon 2048</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;overflow:hidden;background:radial-gradient(ellipse at 50% 10%,#20204c,#101426 70%);color:#f8f5ff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;user-select:none}body{display:flex;flex-direction:column;padding:13px 13px 10px;gap:8px}.top{display:flex;justify-content:space-between;align-items:center}.top strong{font-size:14px;letter-spacing:.4px}.top small{display:block;font-size:9px;color:#9ba4c4;margin-top:5px}.numbers{display:flex;gap:7px}.numbers>div{background:#292b4e;border:1px solid #57577e;border-radius:10px;text-align:center;padding:6px 8px;min-width:56px}.numbers small{display:block;font-size:8px;color:#c3b9fa}.numbers b{font-size:14px}.boardWrap{display:flex;flex:1;min-height:0;flex-direction:column;justify-content:center;align-items:center;gap:9px}.board{width:min(100%,min(48dvh,420px));aspect-ratio:1;background:linear-gradient(135deg,#302d53,#232b45);border:1px solid #706a94;border-radius:17px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:8px;padding:8px;touch-action:none;box-shadow:0 12px 28px #0004}.tile{border-radius:11px;display:grid;place-items:center;line-height:1;min-width:0;font-size:clamp(15px,6vw,27px);font-weight:900;transition:background .14s,color .14s,transform .14s;background:#0c142a66}.tile[data-val="2"]{background:#dad7ff;color:#38314f}.tile[data-val="4"]{background:#bfc5ff;color:#333363}.tile[data-val="8"]{background:#ad9cf2;color:#1a1441}.tile[data-val="16"]{background:#8a9beb;color:#101d44}.tile[data-val="32"]{background:#7cd9dd;color:#173b49}.tile[data-val="64"]{background:#55c9ce;color:#0c313b}.tile[data-val="128"]{background:#e5bd82;color:#492a1c;font-size:23px}.tile[data-val="256"]{background:#e6a989;color:#4e251a;font-size:23px}.tile[data-val="512"]{background:#e78ca9;color:#4e233b;font-size:23px}.tile[data-val="1024"],.tile[data-val="2048"]{background:linear-gradient(135deg,#dfd6ff,#f4c0e3);color:#3d245c;font-size:19px}.directions{display:grid;grid-template-columns:repeat(3,45px);grid-template-rows:repeat(2,38px);gap:4px;justify-content:center}.directions button{border:1px solid #555b7a;background:#2a3150;color:#ddd7ff;border-radius:10px;font-weight:900;font-size:16px;touch-action:manipulation}.directions [data-d="up"]{grid-column:2}.directions [data-d="left"]{grid-column:1;grid-row:2}.directions [data-d="down"]{grid-column:2;grid-row:2}.directions [data-d="right"]{grid-column:3;grid-row:2}.bottom{font-size:10px;color:#aab5d3;text-align:center;line-height:1.45}.smallbtn{border:1px solid #7168a9;color:#e4dbff;background:#4b3e70;border-radius:10px;padding:7px 10px;font-size:10px;font-weight:800}.warn{color:#ffbdc2;font-weight:800;font-size:11px;min-height:14px;text-align:center}@media(max-height:580px){body{gap:4px;padding:6px}.board{width:min(100%,38dvh);gap:5px;padding:6px}.directions{grid-template-rows:repeat(2,32px)}.bottom{display:none}}</style></head><body><header class="top"><div><strong>🧩 MOON 2048</strong><small>Vuốt để ghép số · Chạm 2048 để thắng</small></div><div class="numbers"><div><small>ĐIỂM</small><b id="score">0</b></div><div><small>TỐT NHẤT</small><b id="best">0</b></div></div></header><main class="boardWrap"><div class="board" id="board" role="application" aria-label="Bàn chơi 2048, vuốt ngang dọc để ghép các ô"></div><div class="warn" id="message"></div><div class="directions" aria-label="Điều khiển"><button data-d="up" aria-label="Lên">↑</button><button data-d="left" aria-label="Trái">←</button><button data-d="down" aria-label="Xuống">↓</button><button data-d="right" aria-label="Phải">→</button></div><button class="smallbtn" id="new">↻ Ván mới</button></main><footer class="bottom">Thao tác trên bàn chơi không thay đổi camera hoặc tiến trình quay.</footer><script>
'use strict';let cells=Array(16).fill(0),score=0,best=0,hasWon=false;const board=document.querySelector('#board');for(let i=0;i<16;i++){const el=document.createElement('div');el.className='tile';board.append(el)}
function empty(){return cells.map((v,i)=>v?-1:i).filter(i=>i>=0)}function add(){const arr=empty();if(!arr.length)return;cells[arr[Math.floor(Math.random()*arr.length)]]=Math.random()<.88?2:4}
function newGame(){cells=Array(16).fill(0);score=0;hasWon=false;document.querySelector('#message').textContent='';add();add();paint()}function paint(){board.querySelectorAll('.tile').forEach((el,i)=>{el.textContent=cells[i]||'';el.dataset.val=String(cells[i])});document.querySelector('#score').textContent=score;document.querySelector('#best').textContent=best=Math.max(best,score);parent.postMessage({type:'moonplay-score',game:'merge',score:best},'*')}
function compress(line){let a=line.filter(Boolean),out=[];for(let i=0;i<a.length;i++){if(a[i]===a[i+1]){let v=a[i]*2;out.push(v);score+=v;if(v===2048&&!hasWon){document.querySelector('#message').textContent='🎉 Bạn đã đạt 2048!';hasWon=true}i++}else out.push(a[i])}while(out.length<4)out.push(0);return out}
function move(d){const old=cells.join(',');for(let n=0;n<4;n++){let ids=[];for(let k=0;k<4;k++){if(d==='left')ids.push(n*4+k);else if(d==='right')ids.push(n*4+3-k);else if(d==='up')ids.push(k*4+n);else ids.push((3-k)*4+n)}const updated=compress(ids.map(i=>cells[i]));ids.forEach((i,k)=>cells[i]=updated[k])}if(old===cells.join(','))return;add();paint();if(!empty().length){const can=[0,1,2,3].some(r=>[0,1,2].some(c=>cells[r*4+c]===cells[r*4+c+1]))||[0,1,2].some(r=>[0,1,2,3].some(c=>cells[r*4+c]===cells[(r+1)*4+c]));if(!can)document.querySelector('#message').textContent='Hết nước đi · Chọn Ván mới'}}
let start=null;board.addEventListener('pointerdown',e=>{start=[e.clientX,e.clientY];try{board.setPointerCapture(e.pointerId)}catch{}});board.addEventListener('pointerup',e=>{if(!start)return;let dx=e.clientX-start[0],dy=e.clientY-start[1];start=null;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});document.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>move(b.dataset.d)));document.querySelector('#new').addEventListener('click',newGame);window.addEventListener('keydown',e=>{const d={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(d){e.preventDefault();move(d)}});newGame();
</script></body></html>
