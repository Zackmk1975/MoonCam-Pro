<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Moon 2048 — MoonCam</title>
<style>
:root{color-scheme:dark;--ink:#f5f2ff;--muted:#a6b3ce;--tile-gap:8px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 65% 0%,#29305a,#101728 75%);user-select:none;display:flex;flex-direction:column;gap:6px;padding:8px;overscroll-behavior:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:7px;flex:0 0 auto;min-height:40px}
.heading{min-width:0}.heading strong{display:block;font-size:clamp(12px,3.1vw,15px);letter-spacing:.2px;line-height:1.1}.heading small{display:block;font-size:clamp(9px,2.25vw,11px);color:#a8b9d8;margin-top:4px;white-space:nowrap}
.scores{display:flex;gap:5px;flex:none}.scores>div{min-width:51px;background:#262e4a;border:1px solid #535e81;border-radius:10px;text-align:center;padding:4px 6px}.scores small{display:block;color:#c1cbe3;font-size:9px;letter-spacing:.5px}.scores b{font-size:clamp(12px,3.7vw,17px);font-variant-numeric:tabular-nums}
.boardArea{flex:1;min-height:0;min-width:0;display:grid;place-items:center;position:relative}
.board{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:var(--tile-gap);padding:var(--tile-gap);background:linear-gradient(145deg,#34375d,#28364f);border:1px solid #79799e;border-radius:18px;touch-action:none;box-shadow:0 15px 42px #0007,inset 0 1px #ffffff1c;max-width:100%;max-height:100%;aspect-ratio:1}
.tile{min-width:0;min-height:0;border-radius:clamp(7px,2vw,12px);background:#111b32b8;display:flex;align-items:center;justify-content:center;color:white;line-height:1;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums;font-weight:900;box-shadow:inset 0 -2px #00000016;contain:paint}
.tile.popped{animation:appear .16s ease-out}.tile[data-val="2"]{background:#e4e6ff;color:#2e3654}.tile[data-val="4"]{background:#cfdbff;color:#263963}.tile[data-val="8"]{background:#b4aaff;color:#2c295a}.tile[data-val="16"]{background:#9089ed;color:#fff}.tile[data-val="32"]{background:#6b93ee;color:#fff}.tile[data-val="64"]{background:#4bc2d3;color:#0d3542}.tile[data-val="128"]{background:#8cdbd2;color:#133948}.tile[data-val="256"]{background:#e8cc82;color:#4d381b}.tile[data-val="512"]{background:#f5ac84;color:#4b2d24}.tile[data-val="1024"]{background:#f48d97;color:#4d273e}.tile[data-val="2048"]{background:linear-gradient(135deg,#f5e6a6,#ffba81);color:#55311e;box-shadow:inset 0 1px #fff9,0 0 16px #ffcc8a36}.tile[data-val="4096"],.tile[data-val="8192"],.tile[data-val="16384"],.tile[data-val="32768"],.tile[data-val="65536"],.tile[data-val="131072"]{background:linear-gradient(135deg,#caadff,#f3c3f2);color:#3c2255}
.message{position:absolute;z-index:3;left:50%;bottom:8px;transform:translateX(-50%);background:#1a2139ed;color:#fff;font-size:12px;font-weight:750;border:1px solid #a7a9d1;padding:8px 12px;border-radius:10px;text-align:center;max-width:94%;white-space:normal;pointer-events:none;box-shadow:0 7px 22px #0009}.message:empty{display:none}
.actions{flex:none;display:grid;grid-template-columns:minmax(82px,1fr) minmax(0,1.5fr) minmax(82px,1fr);align-items:center;gap:6px;min-height:39px}
.actions button{min-height:39px;padding:6px 7px;border:1px solid #6875a3;border-radius:11px;color:#f6f4ff;background:#2c3755;font-size:11px;font-weight:800;touch-action:manipulation}
.actions button.new{background:linear-gradient(115deg,#8576db,#4d91ad);border-color:#b0a7f7;color:#fff}
.actions .tip{font-size:clamp(9px,2.4vw,11px);text-align:center;line-height:1.22;color:#b4c7df}.actions button:active{transform:scale(.97)}
@keyframes appear{0%{transform:scale(.84)}100%{transform:scale(1)}}
@media(max-height:330px){body{gap:3px;padding:4px}.top{min-height:31px}.heading small{display:none}.actions{min-height:28px}.actions button{min-height:28px}.message{font-size:10px}}
@media(prefers-reduced-motion:reduce){.tile.popped{animation:none}.actions button:active{transform:none}}
</style></head><body>
<header class="top"><div class="heading"><strong>🧩 MOON 2048</strong><small>Ghép các ô để đạt 2048</small></div><div class="scores"><div><small>ĐIỂM</small><b id="score">0</b></div><div><small>KỶ LỤC</small><b id="best">0</b></div></div></header>
<main class="boardArea" id="area"><div class="board" id="board" role="application" aria-label="Bàn chơi 2048 4 nhân 4. Vuốt ngón tay lên, xuống, trái, phải để di chuyển ô."></div><output class="message" id="message" aria-live="polite"></output></main>
<footer class="actions"><button type="button" id="undo" aria-label="Hoàn tác lượt gần nhất">↶ Hoàn tác</button><span class="tip">Vuốt trên bàn<br>để di chuyển</span><button type="button" class="new" id="new">↻ Chơi mới</button></footer>
<script>
'use strict';
const board=document.getElementById('board'),area=document.getElementById('area'),message=document.getElementById('message');
const tiles=Array.from({length:16},()=>{let e=document.createElement('div');e.className='tile';board.appendChild(e);return e});
let cells=Array(16).fill(0),score=0,best=0,won=false,over=false,lastState=null,notifyTimer=0;
const measureCanvas=document.createElement('canvas'),measure=measureCanvas.getContext('2d');
function notify(text,hold=2100){message.textContent=text;clearTimeout(notifyTimer);if(hold)notifyTimer=setTimeout(()=>message.textContent='',hold)}
function empty(){return cells.flatMap((v,i)=>v?[]:[i])}
function spawn(){const available=empty();if(!available.length)return;cells[available[Math.floor(Math.random()*available.length)]]=Math.random()<.90?2:4}
function layout(){const r=area.getBoundingClientRect();const s=Math.max(90,Math.floor(Math.min(r.width-2,r.height-2,456)));board.style.width=s+'px';board.style.height=s+'px';board.style.setProperty('--tile-gap',Math.max(4,Math.min(10,Math.floor(s/43)))+'px');fitNumbers()}
function fitNumbers(){tiles.forEach(el=>{const str=el.textContent;if(!str)return;const tileW=el.clientWidth;let size=Math.min(40,Math.floor(tileW*.53));while(size>9){measure.font=`900 ${size}px -apple-system,system-ui,sans-serif`;if(measure.measureText(str).width<=tileW*.88)break;size--}el.style.fontSize=size+'px'})}
function render(previous=[]){tiles.forEach((el,i)=>{const value=cells[i];el.textContent=value||'';el.dataset.val=String(value);el.classList.remove('popped');if(value&&previous[i]!==value){void el.offsetWidth;el.classList.add('popped')}});document.getElementById('score').textContent=score.toLocaleString('vi-VN');best=Math.max(best,score);document.getElementById('best').textContent=best.toLocaleString('vi-VN');document.getElementById('undo').disabled=!lastState;fitNumbers();parent.postMessage({type:'moonplay-score',game:'merge',score:best},'*')}
function reset(){cells=Array(16).fill(0);score=0;won=false;over=false;lastState=null;clearTimeout(notifyTimer);message.textContent='';spawn();spawn();render();layout()}
function compact(line){const nonzero=line.filter(Boolean),out=[];for(let i=0;i<nonzero.length;i++){if(nonzero[i]===nonzero[i+1]){const next=nonzero[i]*2;out.push(next);score+=next;i++;if(next>=2048&&!won){won=true;setTimeout(()=>notify('🎉 Đạt 2048! Bạn vẫn có thể chơi tiếp.',3200),100)}}else out.push(nonzero[i])}while(out.length<4)out.push(0);return out}
function hasMoves(){if(cells.includes(0))return true;for(let r=0;r<4;r++)for(let c=0;c<4;c++){const v=cells[r*4+c];if(c<3&&v===cells[r*4+c+1])return true;if(r<3&&v===cells[(r+1)*4+c])return true}return false}
function move(dir){if(over)return;const before=cells.slice(),previousScore=score,previousWon=won;for(let n=0;n<4;n++){const ids=[];for(let k=0;k<4;k++){if(dir==='left')ids.push(n*4+k);else if(dir==='right')ids.push(n*4+(3-k));else if(dir==='up')ids.push(k*4+n);else ids.push((3-k)*4+n)}const compressed=compact(ids.map(i=>cells[i]));ids.forEach((i,k)=>{cells[i]=compressed[k]})}if(before.every((v,i)=>v===cells[i])){score=previousScore;return}lastState={cells:before,score:previousScore,won:previousWon};spawn();render(before);if(!hasMoves()){over=true;notify('Hết nước đi · Hãy thử ván mới!',0)}}
function undo(){if(!lastState)return;cells=lastState.cells.slice();score=lastState.score;won=lastState.won;over=false;lastState=null;notify('Đã hoàn tác lượt gần nhất',1250);render()}
let start=null;board.addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY};try{board.setPointerCapture(e.pointerId)}catch{}});board.addEventListener('pointerup',e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.max(Math.abs(dx),Math.abs(dy))<13)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});board.addEventListener('pointercancel',()=>{start=null});
window.addEventListener('keydown',e=>{const dir={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(dir){e.preventDefault();move(dir)}else if(e.key.toLowerCase()==='u'){undo()}});
document.getElementById('undo').addEventListener('click',undo);document.getElementById('new').addEventListener('click',reset);
window.addEventListener('message',e=>{if(e.data?.type==='moonplay-best-value'&&e.data.game==='merge'){const n=Number(e.data.best);if(Number.isFinite(n)&&n>=0){best=Math.max(best,n);document.getElementById('best').textContent=best.toLocaleString('vi-VN')}}});
window.addEventListener('resize',layout);if('ResizeObserver'in window)new ResizeObserver(layout).observe(area);reset();parent.postMessage({type:'moonplay-best-request',game:'merge'},'*');
</script></body></html>
